<section class="camera-viewer" data-camera-id="{{ camera.id }}" data-video-mode="{{ video_mode }}" aria-label="Transmissão de {{ camera.name }}">
  <div class="video-stage"><video data-video autoplay muted playsinline controls aria-label="Vídeo de {{ camera.name }}"></video><img data-local-frame hidden alt="Prévia local com caixas de detecção"><canvas data-video-overlay aria-hidden="true"></canvas><div class="video-placeholder" data-video-placeholder><span aria-hidden="true">▣</span><p>Vídeo sob demanda</p></div></div>
  <div class="video-caption"><p data-video-status role="status">{% if camera.enabled %}Desconectado. Inicie para visualizar.{% else %}Câmera desabilitada no cadastro.{% endif %}</p><div class="button-row"><button class="primary-button compact" type="button" data-video-start {% if not camera.enabled %}disabled{% endif %}>Conectar</button><button class="secondary-button compact" type="button" data-video-stop disabled>Parar</button></div></div>
  <dl class="video-metrics"><div><dt>Pessoas</dt><dd data-people-count>—</dd></div><div><dt>Vídeo FPS</dt><dd data-video-fps>—</dd></div><div><dt>Análise FPS</dt><dd data-analysis-fps>—</dd></div></dl><p class="video-analysis-status" data-analysis-status>Sem leitura atual. As caixas são recentes, não sincronizadas ao vídeo.</p>
</section>
